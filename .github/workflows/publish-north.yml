name: Build and publish docker images
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: main
  NORTH_TOOL_DIR: src/pynxtools_mpes/nomad/north_tools/mpes

permissions:
  packages: write
  contents: read
  attestations: write
  id-token: write

jobs:
  build:
    name: Build mpes image
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr,prefix=pr-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          flavor: |
            latest=auto

      - name: Build image (load into runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.NORTH_TOOL_DIR }}/Dockerfile
          build-args: |
            IMAGE_TAG=${{ env.IMAGE_TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: false
          load: true   # makes image available for the "Save image tarball" step below

      - name: Save image tarball
        # `needs.build.outputs.tags`/`load: true` only make the image available to *this*
        # job's own runner - `test` and `push_image` run on separate runners with no access
        # to it, so the image has to be handed over explicitly via an artifact.
        run: |
          mkdir -p /tmp/image
          docker save ${{ steps.meta.outputs.tags }} -o /tmp/image/mpes-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpes-image
          path: /tmp/image/mpes-image.tar
          retention-days: 1

  test:
    name: Test with mpes examples
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: mpes-image
          path: /tmp/image

      - name: Load image
        run: docker load -i /tmp/image/mpes-image.tar

      - name: Get first image tag
        id: tag
        run: |
          RAW_TAGS="${{ needs.build.outputs.tags }}"
          FIRST_TAG=$(echo "$RAW_TAGS" | head -n 1)
          echo "tag=$FIRST_TAG" >> $GITHUB_OUTPUT

      - name: Run notebook tests inside container
        # The example notebooks live inside the image at 
        # src/pynxtools_mpes/nomad/example_uploads/example/.
        run: |
          docker run --rm \
            ${{ steps.tag.outputs.tag }} \
            bash -c '
              set -e
              EXAMPLE_DIR="/opt/pynxtools-mpes/src/pynxtools_mpes/nomad/example_uploads/example"
              mkdir -p /tmp/nb_test
              cp "$EXAMPLE_DIR/E1 Convert to NeXus.ipynb" "$EXAMPLE_DIR/config_file.json" /tmp/nb_test/
              cp "$EXAMPLE_DIR/E4 Convert to k-space.ipynb" /tmp/nb_test/
              cd /tmp/nb_test
              curl -sSL -o MoTe2.h5 "https://zenodo.org/records/15717171/files/MoTe2.h5?download=1"
              uv pip install --system pytest nbmake
              pytest --nbmake --nbmake-timeout=3600 "E1 Convert to NeXus.ipynb"
              pytest --nbmake --nbmake-timeout=3600 "E4 Convert to k-space.ipynb"
            '

  push_image:
    name: Publish image
    needs: [build, test]
    runs-on: ubuntu-latest

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: mpes-image
          path: /tmp/image

      - name: Load image
        run: docker load -i /tmp/image/mpes-image.tar

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tags
        run: |
          RAW_TAGS="${{ needs.build.outputs.tags }}"
          for TAG in $RAW_TAGS; do
            docker push "$TAG"
          done