name: Build and publish docker images
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: main
  NORTH_TOOL_DIR: src/pynxtools_mpes/nomad/north_tools/mpes

permissions:
  packages: write
  contents: read
  attestations: write
  id-token: write

jobs:
  build:
    name: Build mpes image
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr,prefix=pr-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          flavor: |
            latest=auto

      - name: Build image (load into runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.NORTH_TOOL_DIR }}/Dockerfile
          build-args: |
            IMAGE_TAG=${{ env.IMAGE_TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: false
          load: true   # critical: makes image available for test job

  test:
    name: Test with mpes examples
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: pip install pytest nbmake

      - name: Download test data
        run: |
          mkdir -p examples
          wget -nc https://zenodo.org/records/7573825/files/MoTe2.h5?download=1 -O examples/MoTe2.h5 || true
          wget -nc https://nomad-lab.eu/prod/v1/api/v1/entries/xV9yMspIyXMfia6nNw3NIbnlZ91H/raw/Scan1496.nxs -O examples/Scan1496.nxs || true

      - name: Get first image tag
        id: tag
        run: |
          RAW_TAGS="${{ needs.build.outputs.tags }}"
          FIRST_TAG=$(echo "$RAW_TAGS" | head -n 1)
          echo "tag=$FIRST_TAG" >> $GITHUB_OUTPUT

      - name: Run notebook tests inside container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/examples:/examples \
            ${{ steps.tag.outputs.tag }} \
            bash -c "
              pip install pytest nbmake &&
              pytest --nbmake --nbmake-timeout=3600 examples/E1* &&
              pytest --nbmake --nbmake-timeout=3600 examples/E4*
            "

  push_image:
    name: Publish image
    needs: [build, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tags
        run: |
          RAW_TAGS="${{ needs.build.outputs.tags }}"
          for TAG in $RAW_TAGS; do
            docker push "$TAG"
          done