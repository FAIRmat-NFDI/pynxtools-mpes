name: Upload Python Package

on:
  release:
    types: [published]

env:
  python-version: 3.12
  WAIT_TIME: 1800 # 30 minutes in seconds  
  CHECK_INTERVAL: 120 # 2 minutes in seconds
  IMAGE: "ghcr.io/fairmat-nfdi/pynxtools-mpes"

jobs:
  setup:
    name: Checkout and Install
    runs-on: ubuntu-latest
    outputs:
      git_tag_version: ${{ steps.git_tag_version.outputs.version }}
      citation_version: ${{ steps.citation_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install uv and set the python version to ${{ env.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.python-version }}
      - name: Git tag version
        id: git_tag_version
        run: |
          GIT_TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$GIT_TAG_VERSION" >> "$GITHUB_OUTPUT"
      - name: Citation version
        id: citation_version
        run: |
          CITATION_VERSION=$(grep '^version:' CITATION.cff | cut -d' ' -f2)
          echo "version=$CITATION_VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: Run Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install uv and set the python version to ${{ env.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.python-version }}
      - name: Install latest nomad release
        run: |
          uv pip install nomad-lab[infrastructure]
      - name: Install pynxtools-mpes
        run: |
          uv pip install -e ".[dev]"
      - name: Test with pytest
        run: pytest tests/

  compare-versions:
    name: Compare Versions
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Fail if versions mismatch
        run: |
          if [ "${{ needs.setup.outputs.git_tag_version }}" != "${{ needs.setup.outputs.citation_version }}" ]; then
            echo "Version mismatch: Git tag is ${{ needs.setup.outputs.git_tag_version }}, CITATION.cff is ${{ needs.setup.outputs.citation_version }}"
            exit 1
          fi

  check-if-image-exists:
    name: Check image in GitHub Container Registry
    runs-on: ubuntu-latest
    steps:
      - name: Check if image exists in GitHub Container Registry
        run: |
          FULL_IMAGE="${{ env.IMAGE }}:${GITHUB_REF_NAME}"
          echo "Checking if image ${FULL_IMAGE} is available..."
          ELAPSED_TIME=0

          while true; do
            if docker manifest inspect ${FULL_IMAGE} > /dev/null 2>&1; then
              echo "Image ${FULL_IMAGE} found successfully!"
              exit 0
            fi

            if [[ ${ELAPSED_TIME} -ge ${{ env.WAIT_TIME }} ]]; then
              echo "Timeout reached (${{ env.WAIT_TIME }} seconds). Image ${FULL_IMAGE} not found!"
              exit 1
            fi

            echo "Image not found yet. Retrying in ${{ env.CHECK_INTERVAL }} seconds... (${ELAPSED_TIME}s / ${{ env.WAIT_TIME }}s elapsed)"
            sleep ${{ env.CHECK_INTERVAL }}
            ELAPSED_TIME=$((ELAPSED_TIME + ${{ env.CHECK_INTERVAL }}))
          done
  
  build:
    name: Build Package
    needs: [compare-versions, test, check-if-image-exists]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install uv and set the python version to ${{ env.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.python-version }}
      - name: Overwrite the image tag
        run: |
          IMAGE_TAG=$(grep -oP "${{ env.IMAGE }}:\K[^'\",]+" src/pynxtools_mpes/nomad/north_tools/__init__.py)

          sed -i "s|${{ env.IMAGE }}:${IMAGE_TAG}|${{ env.IMAGE }}:${GITHUB_REF_NAME}|g" \
          src/pynxtools_mpes/nomad/north_tools/__init__.py
      - name: Build package
        run: |
          # Use SETUPTOOLS_SCM_PRETEND_VERSION to skip the version check due to image_tag modification of the __init__.py file
          SETUPTOOLS_SCM_PRETEND_VERSION=${GITHUB_REF_NAME#v} uv build
      - name: Check the image tag in the entry point
        run: |
          # un zip the built package and check the image tag in the entry point
          tar -xzf dist/*.tar.gz -C dist/
          IMAGE_TAG=$(grep -oP "${{ env.IMAGE }}:\K[^'\",]+" dist/pynxtools-mpes-*/src/pynxtools_mpes/nomad/north_tools/__init__.py)

          if [[ "${IMAGE_TAG}" == "${GITHUB_REF_NAME}" ]]; then
            echo "Before building the Python package, image ${{ env.IMAGE }}:${GITHUB_REF_NAME} is updated for NORTH tool."
          else
            echo "Error: Image tag in __init__.py is not correct: ${IMAGE_TAG}. Expected: ${{ env.IMAGE }}:${GITHUB_REF_NAME}"
            exit 1
          fi

          # Remove the unzipped package after checking
          rm -rf dist/pynxtools-mpes-*/
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

  deploy:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pynxtools-mpes
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1